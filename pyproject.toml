[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorassist"
version = "0.1.0"
description = "A LangGraph learning lab for fictional sensor test investigations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langgraph==1.2.18"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
